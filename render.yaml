# Render Blueprint — NearSoul Alpha (free test deployment). PRD 18-release-plan.
# One web service serves both the API and the Flutter web app (same origin → secure cookies work on onrender.com).
# Fill the `sync: false` values in the Render dashboard when you create the Blueprint. Never commit secrets.
databases:
  - name: nearsoul-alpha-db
    region: frankfurt
    plan: free
    databaseName: nearsoul
    user: nearsoul
    postgresMajorVersion: "17"

services:
  - type: web
    name: nearsoul-alpha
    runtime: node
    region: frankfurt
    plan: free # sleeps after ~15 min idle; first request then takes ~1 min. Upgrade to starter for always-on.
    # The Flutter web build is prebuilt into deploy/web (scripts/build-web-dist.sh) to keep free-tier builds fast and small.
    buildCommand: npm ci && cd apps/api && npx prisma generate && npx tsc -p tsconfig.build.json
    startCommand: cd apps/api && npx prisma migrate deploy && npx tsx prisma/seed.ts && npx tsx prisma/seed-demo.ts && node dist/main.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: alpha
      - key: DATABASE_URL
        fromDatabase:
          name: nearsoul-alpha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_DIST_DIR
        value: ../../deploy/web
      - key: INVITE_ONLY
        value: "false" # open registration for the first test; switch to "true" for invite-only
      - key: PAYWALL_ENABLED
        value: "false"
      - key: LAUNCH_CITY
        value: amsterdam
      - key: STORAGE_DRIVER
        value: db # photos in Postgres (free tier has no persistent disk); move to s3/R2 later
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false # Brevo → SMTP & API → API keys
      - key: EMAIL_FROM
        sync: false # e.g. NearSoul <your.verified.sender@gmail.com>
      - key: APP_ORIGINS
        sync: false # https://nearsoul-alpha.onrender.com
      - key: APP_PUBLIC_URL
        sync: false # https://nearsoul-alpha.onrender.com
      - key: PUBLIC_API_URL
        sync: false # https://nearsoul-alpha.onrender.com
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false # your email: the first admin's password + TOTP link appear once in the deploy log
      - key: AI_ENABLED
        value: "false" # set to true after adding ANTHROPIC_API_KEY
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_BUDGET_USD
        value: "10"
