# Render Blueprint — NearSoul Alpha (free test deployment). PRD 18-release-plan.
# One web service serves both the API and the Flutter web app (same origin → secure cookies work on onrender.com).
# Nothing has to be filled in to start: the `sync: false` values are optional (leave them empty). Never commit secrets.
databases:
  - name: nearsoul-alpha-db
    region: frankfurt
    plan: free
    databaseName: nearsoul
    user: nearsoul
    postgresMajorVersion: "17"

services:
  - type: web
    name: nearsoul-alpha
    runtime: node
    region: frankfurt
    autoDeploy: true # deploy every push to main
    plan: free # sleeps after ~15 min idle; first request then takes ~1 min. Upgrade to starter for always-on.
    # The Flutter web build is prebuilt into deploy/web (scripts/build-web-dist.sh) to keep free-tier builds fast and small.
    buildCommand: npm ci && cd apps/api && npx prisma generate && npx tsc -p tsconfig.build.json
    # Demo profiles are created in the background so the site is up right away (the first run takes a few minutes).
    startCommand: cd apps/api && npx prisma migrate deploy && npx tsx prisma/seed.ts && (npx tsx prisma/seed-demo.ts &) && node dist/main.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: alpha
      - key: DATABASE_URL
        fromDatabase:
          name: nearsoul-alpha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_DIST_DIR
        value: ../../deploy/web
      - key: INVITE_ONLY
        value: "false" # open registration for the first test; switch to "true" for invite-only
      - key: PAYWALL_ENABLED
        value: "true" # levels are on; in the alpha anyone can switch levels for free (Me → Subscription → Activate (test))
      - key: DAILY_SET_SIZE
        value: "200" # alpha demo: long Today's Souls; production default is 15
      - key: LAUNCH_CITY
        value: amsterdam
      - key: STORAGE_DRIVER
        value: db # photos in Postgres (free tier has no persistent disk); move to s3/R2 later
      # Friends test without any email account: the sign-in code is shown on screen (anyone who knows an email
      # can sign in as it, so only invite people you trust). Before production: EMAIL_PROVIDER=brevo + BREVO_API_KEY
      # + EMAIL_FROM (the server refuses "screen" when APP_ENV is staging/production).
      - key: EMAIL_PROVIDER
        value: screen
      # If Render adds a suffix to the service name (e.g. nearsoul-alpha-y6qr), the server uses Render's real URL
      # automatically (RENDER_EXTERNAL_URL); set these only for a custom domain.
      - key: APP_ORIGINS
        value: https://nearsoul-alpha.onrender.com
      - key: APP_PUBLIC_URL
        value: https://nearsoul-alpha.onrender.com
      - key: PUBLIC_API_URL
        value: https://nearsoul-alpha.onrender.com
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false # optional, your email: the first admin's password + TOTP link appear once in the deploy log
      # Social sign-in (CR-33), all optional: buttons say "coming soon" until a client id is set.
      # Google Cloud Console → OAuth client (Web), authorized redirect: https://<site>/auth/callback.html
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # Apple Developer → Services ID with "Sign in with Apple", return URL: https://<site>/auth/callback.html
      - key: APPLE_CLIENT_IDS
        sync: false
      # id.vk.com → app (Web), trusted redirect: https://<site>/auth/callback.html
      - key: VK_CLIENT_ID
        sync: false
      - key: AI_ENABLED
        value: "false" # set to true after adding ANTHROPIC_API_KEY
      - key: ANTHROPIC_API_KEY
        sync: false # optional, later
      - key: AI_DAILY_BUDGET_USD
        value: "10"
